name: Build and publish site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust and wasm-pack
        run: |
          rustup show
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Test build tooling
        run: |
          python -m unittest discover -s scripts -p test_build_site.py
          python -m unittest discover -s scripts -p test_migrate_content.py
      - name: Build and validate
        run: python scripts/build_site.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/master' &&
      vars.PAGES_PUBLISH_ENABLED == 'true' && vars.PAGES_REPOSITORY != '' &&
      vars.PAGES_REPOSITORY != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pages-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist/
      - name: Validate downloaded site
        run: python scripts/build_site.py check
      - name: Publish to the separate Pages repository
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: ${{ vars.PAGES_REPOSITORY }}
          publish_branch: ${{ vars.PAGES_BRANCH || 'gh-pages' }}
          publish_dir: ./dist
          keep_files: false
          force_orphan: false
          enable_jekyll: false
          full_commit_message: 'Deploy koiro-blog ${{ github.sha }}'
