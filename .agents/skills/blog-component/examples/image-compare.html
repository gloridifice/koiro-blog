<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片对比</title>
<!-- Inline this stylesheet and the script below when delivering a self-contained component. -->
<link rel="stylesheet" href="../assets/image-compare.css">
</head>
<body>
<figure class="kc-compare" data-state="loading" style="--compare-ratio: 1200 / 750">
  <div class="kc-compare-stage">
    <!-- Both images use the same full-size coordinates; A is clipped over B. -->
    <img class="kc-compare-image-b" src="./images/compare-b.svg" width="1200" height="750" alt="B：着色并显示网格的山地示意图" draggable="false">
    <img class="kc-compare-image-a" src="./images/compare-a.svg" width="1200" height="750" alt="A：灰色山地示意图" draggable="false">
    <input class="kc-compare-range" type="range" min="0" max="100" step="0.1" value="50"
      aria-label="A、B 图片分界位置" aria-describedby="compare-caption" disabled>
    <span class="kc-compare-divider" aria-hidden="true"></span>
    <span class="kc-compare-handle" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m8 7-5 5 5 5m8-10 5 5-5 5"/>
      </svg>
    </span>
  </div>
  <figcaption id="compare-caption">A：灰色示意图；B：着色与网格示意图。</figcaption>
  <p class="kc-compare-error" role="status" hidden></p>
  <noscript><p class="kc-compare-error">需要启用 JavaScript 才能拖动图片分界线。</p></noscript>
</figure>
<script src="../assets/image-compare.js"></script>
</body>
</html>
